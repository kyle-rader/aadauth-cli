[package]
name = "msal-rust"
version = "0.1.0"
edition = "2021"
description = "Microsoft Authentication Library (MSAL) for Rust - Web browser public client authentication flow"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.0"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
webbrowser = "0.8"